[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "input-bench"
version = "0.1.0"
description = "Reproducible compiler and replay client for LLM serving workloads"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["aiohttp>=3.9", "pyarrow>=14", "transformers>=4.40"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
input-bench = "input_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
